# e1_imgsz1280 – E0에서 한 가지만 바꾼 실험
# 비교 기준: e0_baseline
name: e1_imgsz1280
description: YOLO11s, 1280px (E0 대비 해상도만 변경)
model: yolo11s.pt          # COCO 사전학습 가중치
data: data_fold0.yaml      # 조합 단위 5-Fold 중 fold 0
imgsz: 1280
epochs: 100
patience: 30               # val 개선이 30 에포크 없으면 조기 종료
batch: 4
optimizer: auto
workers: 4
