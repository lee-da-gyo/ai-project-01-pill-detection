# e1_imgsz960 – E0에서 한 가지만 바꾼 실험
# 비교 기준: e0_baseline
name: e1_imgsz960
description: YOLO11s, 960px (E0 대비 해상도 변경. VRAM 때문에 batch 16→8, Ultralytics가 nbs=64로 기울기를 누적해 유효 배치는 동일)
model: yolo11s.pt          # COCO 사전학습 가중치
data: data_fold0.yaml      # 조합 단위 5-Fold 중 fold 0
imgsz: 960
epochs: 100
patience: 30               # val 개선이 30 에포크 없으면 조기 종료
batch: 8
optimizer: auto
workers: 4
