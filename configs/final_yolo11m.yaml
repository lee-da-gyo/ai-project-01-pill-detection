# final_yolo11m – 제출용: 232장 전체로 학습 (검증 없음 → last.pt 사용)
# 에포크 = 5-Fold best epoch 중앙값 (80/90/50/44/80 → 80) – 최적 보장이 없는 휴리스틱.
#   민감도: reports/experiments/epoch_sensitivity.csv (라벨 수정 후 재계산, 중앙값의 fold 평균 손해 0.003 이하). 그 밖의 설정은 e2_yolo11m과 같다.
name: final_yolo11m
description: YOLO11m, 640px, 전체 데이터, 80 에포크 (5-Fold best epoch 중앙값)
model: yolo11m.pt
data: data_full.yaml
imgsz: 640
epochs: 80
patience: 0
batch: 16
optimizer: auto
workers: 4
