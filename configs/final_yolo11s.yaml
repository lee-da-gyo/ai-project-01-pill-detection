# final_yolo11s – 제출용: 232장 전체로 학습 (검증 없음 → last.pt 사용)
# 에포크 = 5-Fold best epoch 중앙값 (80/81/86/26/59 → 80) – 최적 보장이 없는 휴리스틱.
#   민감도: reports/experiments/epoch_sensitivity.csv (중앙값의 fold 평균 손해 0.003 이하, 라벨 수정 후 재계산). 그 밖의 설정은 e0_baseline과 같다.
name: final_yolo11s
description: YOLO11s, 640px, 전체 데이터, 80 에포크 (5-Fold best epoch 중앙값)
model: yolo11s.pt
data: data_full.yaml
imgsz: 640
epochs: 80
patience: 0
batch: 16
optimizer: auto
workers: 4
