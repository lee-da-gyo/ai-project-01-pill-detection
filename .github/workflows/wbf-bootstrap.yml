name: OOF comparison reproduce

# 채택 · 기각 근거인 짝지은 비교 4개(CLAHE, TTA 2개, WBF)를 커밋된 OOF 예측만으로 다시 계산하고,
# 결과 CSV가 저장소에 커밋된 것과 같은지 확인한다 (조합 단위 부트스트랩 1000회, seed 42).
on:
  push:
    branches: [main]
    paths:
      - scripts/compare_oof.py
      - scripts/analyze_oof.py
      - src/pilldet/ensemble.py
      - src/pilldet/evaluate.py
      - .github/workflows/wbf-bootstrap.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: e0_baseline e4_clahe
            out: compare_e0_baseline_vs_e4_clahe.csv
          - args: e0_baseline e0_baseline_tta
            out: compare_e0_baseline_vs_e0_baseline_tta.csv
          - args: e2_yolo11m e2_yolo11m_tta
            out: compare_e2_yolo11m_vs_e2_yolo11m_tta.csv
          - args: e0_baseline e0_baseline+e2_yolo11m --wbf-weights 2 1 --wbf-iou 0.6
            out: compare_e0_baseline_vs_e0_baseline+e2_yolo11m.csv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: 의존성 설치 (CPU용 PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 짝지은 비교 다시 계산
        env:
          YOLO_CONFIG_DIR: /tmp/ultralytics
          MPLBACKEND: Agg
        run: python scripts/compare_oof.py ${{ matrix.args }}

      - name: 결과 CSV 1/3 (공개 알림, 줄 1~10)
        run: python -c "import sys; L=open(sys.argv[1], encoding='utf-8-sig').read().splitlines(); [print('::notice title=csv-0-%02d::' % k + l) for k, l in enumerate(L[0:10])]" "reports/experiments/${{ matrix.out }}"

      - name: 결과 CSV 2/3 (공개 알림, 줄 11~20)
        run: python -c "import sys; L=open(sys.argv[1], encoding='utf-8-sig').read().splitlines(); [print('::notice title=csv-1-%02d::' % k + l) for k, l in enumerate(L[10:20])]" "reports/experiments/${{ matrix.out }}"

      - name: 결과 CSV 3/3 (공개 알림, 줄 21~30)
        run: python -c "import sys; L=open(sys.argv[1], encoding='utf-8-sig').read().splitlines(); [print('::notice title=csv-2-%02d::' % k + l) for k, l in enumerate(L[20:30])]" "reports/experiments/${{ matrix.out }}"

      - name: 커밋된 결과와 같은지 확인
        run: |
          f="reports/experiments/${{ matrix.out }}"
          { echo '```csv'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git ls-files --error-unmatch "$f"  # 커밋되지 않은 파일이면 실패 (git diff는 추적하지 않는 파일을 비교하지 않는다)
          git diff --exit-code --stat -- "$f"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: reports/experiments/${{ matrix.out }}
